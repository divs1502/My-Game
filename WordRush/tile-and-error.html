<style>
  :root{
    color-scheme: dark;
    --board:#3a1d22;
    --board-deep:#2a1318;
    --board-edge:#4d2a30;
    --bone:#f7efe0;
    --bone-edge:#cbb694;
    --ink:#2a1318;
    --mustard:#f5b942;
    --sage:#a9d98c;
    --rust:#ff8f70;
    --paper:#fdf6ec;
    --muted:#d7bcb0;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
    background:var(--board-deep);
    background-image:
      radial-gradient(120% 90% at 50% 0%, #4a262c 0%, #2a1318 70%);
    font-family:"Outfit","Helvetica Neue",Arial,sans-serif;
    color:var(--paper);
    -webkit-font-smoothing:antialiased;
  }

  .board{
    width:100%;
    max-width:460px;
    background:var(--board);
    border:1px solid var(--board-edge);
    border-radius:14px;
    box-shadow:0 24px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    position:relative;
  }

  /* ---------- timer rail ---------- */
  .rail{height:8px;background:rgba(0,0,0,.4)}
  .rail span{
    display:block;height:100%;width:100%;
    background:var(--mustard);
    box-shadow:0 0 12px rgba(245,185,66,.5);
    transition:width .1s linear, background-color .3s ease;
  }
  .rail.low span{background:var(--rust);box-shadow:0 0 14px rgba(255,143,112,.6)}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:16px 20px 14px;
    border-bottom:1px solid var(--board-edge);
  }
  .wordmark{
    font-family:"Fraunces","Iowan Old Style",Georgia,serif;
    font-weight:900;font-size:19px;letter-spacing:-.01em;color:var(--paper);
  }
  .wordmark em{font-style:normal;color:var(--mustard)}
  .status{display:flex;align-items:center;gap:13px;font-size:14px;color:var(--muted)}
  .status b{color:var(--paper);font-weight:600}
  .status .secs{
    font-variant-numeric:tabular-nums;
    color:var(--mustard);font-weight:600;
  }
  .status .secs.low{color:var(--rust)}
  .lives{display:flex;gap:4px}
  .lives i{
    width:10px;height:13px;border-radius:2px;
    background:var(--bone);border:1px solid var(--bone-edge);
    transition:background-color .3s ease, opacity .3s ease;
  }
  .lives i.gone{background:transparent;border-color:var(--board-edge);opacity:.6}

  /* ---------- play area ---------- */
  .play{padding:26px 20px 22px}

  .rack{
    display:flex;flex-wrap:wrap;justify-content:center;gap:7px;
    min-height:62px;margin-bottom:22px;
  }
  .tile{
    width:44px;height:52px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(175deg,#fbf4e6,var(--bone));
    color:var(--ink);
    border-radius:5px;
    border-bottom:3px solid var(--bone-edge);
    font-family:"Fraunces","Iowan Old Style",Georgia,serif;
    font-weight:900;font-size:26px;line-height:1;
    text-transform:uppercase;
    user-select:none;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
    animation:drop .32s cubic-bezier(.2,1.2,.4,1) backwards;
  }
  @keyframes drop{
    from{transform:translateY(-16px) rotate(-6deg);opacity:0}
    to{transform:none;opacity:1}
  }
  .rack.wrong{animation:shake .4s ease}
  @keyframes shake{
    20%{transform:translateX(-9px)} 40%{transform:translateX(8px)}
    60%{transform:translateX(-5px)} 80%{transform:translateX(3px)}
  }
  .rack.right .tile{background:linear-gradient(175deg,#d7e6c9,#b9d1a4);border-bottom-color:#8ba777}

  .hint{
    display:flex;align-items:center;gap:10px;
    min-height:48px;padding:12px 15px;margin-bottom:16px;
    background:rgba(0,0,0,.22);
    border-left:4px solid var(--board-edge);
    border-radius:0 6px 6px 0;
    font-size:15.5px;line-height:1.5;color:var(--muted);
  }
  .hint.open{
    border-left-color:var(--mustard);
    background:rgba(245,185,66,.12);
    color:var(--paper);font-weight:500;
  }

  input[type=text]{
    width:100%;height:52px;padding:0 16px;
    font-family:inherit;font-size:17px;letter-spacing:.06em;
    color:var(--paper);
    background:rgba(0,0,0,.28);
    border:1px solid var(--board-edge);
    border-radius:8px;
    outline:none;
    transition:border-color .2s ease, background-color .2s ease;
  }
  input::placeholder{color:#b2928a}
  input:focus{border-color:var(--mustard);background:rgba(0,0,0,.4)}

  .msg{
    display:flex;align-items:center;
    min-height:50px;margin:12px 0 16px;padding:12px 15px;
    border-radius:8px;
    border:1px solid transparent;
    background:rgba(0,0,0,.2);
    font-size:15.5px;font-weight:500;line-height:1.4;
    color:var(--muted);
  }
  .msg:empty{
    min-height:50px;background:rgba(0,0,0,.1);
    border:1px dashed var(--board-edge);
  }
  .msg.ok{
    color:#d7f0c0;background:rgba(169,217,140,.16);border-color:rgba(169,217,140,.5);
  }
  .msg.bad{
    color:#ffcdbc;background:rgba(255,143,112,.16);border-color:rgba(255,143,112,.5);
  }
  .msg.note{
    color:#ffe0a8;background:rgba(245,185,66,.14);border-color:rgba(245,185,66,.45);
  }
  .msg.pop{animation:pop .3s ease}
  @keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

  button{
    font-family:inherit;cursor:pointer;border:none;outline:none;
    transition:transform .15s ease, background-color .2s ease, color .2s ease;
  }
  button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}

  .primary{
    width:100%;height:50px;
    background:var(--mustard);color:#32190f;
    font-size:16px;font-weight:600;border-radius:8px;
  }
  .primary:hover{background:#efb045}

  .minor{
    display:flex;gap:8px;margin-top:10px;
  }
  .minor button{
    flex:1;padding:12px 4px;
    background:rgba(255,255,255,.06);color:var(--paper);
    border:1px solid #63383f;border-radius:8px;
    font-size:14px;font-weight:500;
  }
  .minor button:hover:not(:disabled){color:var(--paper);background:rgba(255,255,255,.05)}
  .minor button:disabled{opacity:.35;cursor:not-allowed}

  footer{
    display:flex;justify-content:space-between;
    padding:14px 20px;border-top:1px solid var(--board-edge);
    font-size:14px;color:var(--muted);
  }
  footer b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- overlay screens ---------- */
  .screen{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:32px 26px;text-align:center;
    background:var(--board);
  }
  .screen[hidden]{display:none}
  .titlerack{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
  .titlerack .tile{width:33px;height:40px;font-size:20px;border-bottom-width:2px}
  .titlerack .amp{background:none;box-shadow:none;border:none;color:var(--mustard);width:20px}
  .screen p{max-width:34ch;font-size:14.5px;line-height:1.6;color:var(--muted)}
  .screen .primary{max-width:220px}
  .tally{
    display:flex;gap:28px;justify-content:center;
    font-size:13px;color:var(--muted);
  }
  .tally b{
    display:block;font-family:"Fraunces",Georgia,serif;font-weight:900;
    font-size:30px;color:var(--paper);line-height:1.2;
  }
  .tally b.gold{color:var(--mustard)}
  .final-word{font-size:14.5px;color:var(--muted)}
  .final-word b{color:var(--paper);font-weight:600;letter-spacing:.08em}

  @media (max-width:400px){
    .tile{width:38px;height:46px;font-size:22px}
    .play{padding:22px 16px 18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<main class="board">

  <!-- start screen -->
  <section class="screen" id="startScreen">
    <div class="titlerack" aria-label="Tile and Error">
      <span class="tile">T</span><span class="tile">I</span><span class="tile">L</span><span class="tile">E</span>
      <span class="tile amp">&amp;</span>
      <span class="tile">E</span><span class="tile">R</span><span class="tile">R</span><span class="tile">O</span><span class="tile">R</span>
    </div>
    <p>Unscramble the tiles before the clock runs out. Words get longer and the clock gets shorter. Three mistakes ends the run.</p>
    <button class="primary" id="startBtn">Start the run</button>
  </section>

  <!-- game over screen -->
  <section class="screen" id="overScreen" hidden>
    <h2 class="wordmark" style="font-size:24px">Run over</h2>
    <div class="tally">
      <div>score<b class="gold" id="finalScore">0</b></div>
      <div>level<b id="finalLevel">1</b></div>
      <div>best<b id="finalBest">0</b></div>
    </div>
    <p class="final-word" id="finalWord"></p>
    <button class="primary" id="againBtn">Play again</button>
  </section>

  <div class="rail" id="rail"><span id="railFill"></span></div>

  <header>
    <div class="wordmark">Tile <em>&amp;</em> Error</div>
    <div class="status">
      <span class="secs" id="secsOut">30s</span>
      <span>level <b id="levelOut">1</b></span>
      <span class="lives" id="lives" aria-label="lives remaining">
        <i></i><i></i><i></i>
      </span>
    </div>
  </header>

  <div class="play">
    <div class="rack" id="rack"></div>

    <p class="hint" id="hint">Hint locked. You have three for the whole run.</p>

    <input type="text" id="answer" spellcheck="false" autocomplete="off"
           autocapitalize="off" placeholder="Type the word">

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <button class="primary" id="checkBtn">Check word</button>
    <div class="minor">
      <button id="shuffleBtn">Shuffle</button>
      <button id="hintBtn">Hint (3)</button>
      <button id="skipBtn">Skip</button>
    </div>
  </div>

  <footer>
    <span>score <b id="scoreOut">0</b></span>
    <span>streak <b id="streakOut">&times;1</b></span>
    <span>best <b id="bestOut">0</b></span>
  </footer>

</main>

const el = id => document.getElementById(id);
const rack = el("rack"), hintBox = el("hint"), input = el("answer"), msgBox = el("msg"),
      railFill = el("railFill"), rail = el("rail"), livesBox = el("lives"),
      levelOut = el("levelOut"), scoreOut = el("scoreOut"),
      streakOut = el("streakOut"), bestOut = el("bestOut");

const MAX_LIVES = 3, MAX_HINTS = 3;
let word, hintText, level, score, streak, lives, hints, best = 0,
    hintUsed, roundTime, msLeft, ticker, used = [], lastPraise = "";

try { best = parseInt(localStorage.getItem("tileError.best") || "0", 10) || 0; } catch (e) {}
const saveBest = () => { try { localStorage.setItem("tileError.best", String(best)); } catch (e) {} };

const pick = a => a[Math.floor(Math.random() * a.length)];

function tierFor(lv){
  if (lv <= 3) return "easy";
  if (lv <= 8) return Math.random() < 0.25 ? "easy" : "medium";
  if (lv <= 14) return Math.random() < 0.55 ? "medium" : "hard";
  return Math.random() < 0.2 ? "medium" : "hard";
}

// clock shrinks from 30s down to a 12s floor
const timeFor = lv => Math.max(12, 30 - Math.floor((lv - 1) / 2) * 2);

function scramble(w){
  let out = w;
  for (let guard = 0; guard < 12 && out === w; guard++){
    const a = w.split("");
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    out = a.join("");
  }
  return out;
}

const sorted = w => w.split("").sort().join("");

function distance(a, b){
  const m = [];
  for (let i = 0; i <= b.length; i++) m[i] = [i];
  for (let j = 0; j <= a.length; j++) m[0][j] = j;
  for (let i = 1; i <= b.length; i++)
    for (let j = 1; j <= a.length; j++)
      m[i][j] = b[i-1] === a[j-1] ? m[i-1][j-1]
        : Math.min(m[i-1][j-1] + 1, m[i][j-1] + 1, m[i-1][j] + 1);
  return m[b.length][a.length];
}

function say(text, kind){
  msgBox.textContent = text;
  msgBox.className = "msg" + (kind ? " " + kind : "");
  if (text){
    void msgBox.offsetWidth;
    msgBox.classList.add("pop");
  }
}

function drawRack(letters){
  rack.className = "rack";
  rack.innerHTML = "";
  letters.split("").forEach((ch, i) => {
    const t = document.createElement("span");
    t.className = "tile";
    t.textContent = ch;
    t.style.animationDelay = (i * 35) + "ms";
    rack.appendChild(t);
  });
}

function paintHud(){
  levelOut.textContent = level;
  scoreOut.textContent = score.toLocaleString();
  streakOut.innerHTML = "&times;" + multiplier().toFixed(2).replace(/\.00$/, "");
  bestOut.textContent = best.toLocaleString();
  el("hintBtn").textContent = "Hint (" + hints + ")";
  el("hintBtn").disabled = hints === 0 || hintUsed;
  [...livesBox.children].forEach((pip, i) => pip.classList.toggle("gone", i >= lives));
}

const multiplier = () => Math.min(3, 1 + streak * 0.25);

function startClock(seconds){
  clearInterval(ticker);
  roundTime = seconds * 1000;
  msLeft = roundTime;
  rail.classList.remove("low");
  railFill.style.width = "100%";
  const secsOut = el("secsOut");
  secsOut.textContent = seconds + "s";
  secsOut.classList.remove("low");
  ticker = setInterval(() => {
    msLeft -= 100;
    const pct = Math.max(0, msLeft / roundTime) * 100;
    railFill.style.width = pct + "%";
    secsOut.textContent = Math.max(0, Math.ceil(msLeft / 1000)) + "s";
    rail.classList.toggle("low", pct < 30);
    secsOut.classList.toggle("low", pct < 30);
    if (msLeft <= 0) timeUp();
  }, 100);
}

function timeUp(){
  clearInterval(ticker);
  lives--;
  streak = 0;
  paintHud();
  if (lives <= 0) return endRun("Time ran out on " + word.toUpperCase() + ".");
  say("Out of time. The word was " + word.toUpperCase() + ". " +
      lives + (lives === 1 ? " life" : " lives") + " left.", "bad");
  setTimeout(nextWord, 1400);
}

function nextWord(){
  const tier = tierFor(level);
  let entry, guard = 0;
  do { entry = pick(BANK[tier]); guard++; } while (used.includes(entry[0]) && guard < 40);

  used.push(entry[0]);
  if (used.length > 45) used.shift();

  word = entry[0];
  hintText = entry[1];
  hintUsed = false;

  drawRack(scramble(word));
  hintBox.className = "hint";
  hintBox.textContent = hints > 0
    ? "Hint locked. " + hints + (hints === 1 ? " left for the run." : " left for the run.")
    : "No hints left. You're on your own.";
  input.value = "";
  input.maxLength = word.length;
  input.focus();
  paintHud();
  startClock(timeFor(level));
}

const PRAISE = ["Solved.", "Clean.", "Got it.", "Unlocked.", "Cracked it."];

function check(){
  const guess = input.value.toLowerCase().replace(/[^a-z]/g, "");

  if (!guess) return say("Type a word first.", "bad");

  if (guess !== word){
    rack.classList.remove("wrong");
    void rack.offsetWidth;
    rack.classList.add("wrong");

    if (sorted(guess) === sorted(word)){
      say("Right letters, wrong order. Rearrange them.", "bad");
    } else if (guess.length !== word.length){
      say("You typed " + guess.length + " letters. The word has " + word.length + ".", "bad");
    } else {
      const d = distance(guess, word);
      say(d <= 2
        ? "Nearly — " + d + (d === 1 ? " letter is" : " letters are") + " wrong."
        : "Not this one. Use every tile on the rack, once each.", "bad");
    }
    input.select();
    return;
  }

  // correct
  clearInterval(ticker);
  rack.classList.add("right");

  const secsLeft = Math.max(0, msLeft / 1000);
  const speedBonus = Math.round(secsLeft * 6 * (hintUsed ? 0.5 : 1));
  const base = word.length * 12;
  const gained = Math.round((base + speedBonus) * multiplier());

  score += gained;
  streak++;
  level++;
  if (score > best){ best = score; saveBest(); }

  let praise;
  do { praise = pick(PRAISE); } while (praise === lastPraise && PRAISE.length > 1);
  lastPraise = praise;

  const streakNote = streak >= 3 ? " " + streak + " in a row, multiplier now \u00d7" +
        multiplier().toFixed(2).replace(/\.00$/, "") + "." : "";
  say(praise + " " + word.toUpperCase() + " for " + gained + " points." + streakNote, "ok");
  paintHud();
  setTimeout(nextWord, 900);
}

function useHint(){
  if (hints === 0 || hintUsed) return;
  hints--;
  hintUsed = true;
  hintBox.className = "hint open";
  hintBox.textContent = hintText;
  say("Hint spent, " + hints + " left. Half speed bonus this round.", "note");
  paintHud();
  input.focus();
}

function shuffle(){
  drawRack(scramble(word));
  input.focus();
}

function skip(){
  clearInterval(ticker);
  streak = 0;
  say("Skipped " + word.toUpperCase() + ". Streak back to \u00d71.", "note");
  paintHud();
  setTimeout(nextWord, 1100);
}

function startRun(){
  level = 1; score = 0; streak = 0; lives = MAX_LIVES; hints = MAX_HINTS;
  used = []; lastPraise = "";
  el("startScreen").hidden = true;
  el("overScreen").hidden = true;
  say("Rearrange the tiles into a real word, then press Enter.", "note");
  paintHud();
  nextWord();
}

function endRun(reason){
  clearInterval(ticker);
  railFill.style.width = "0%";
  if (score > best){ best = score; saveBest(); }
  el("finalScore").textContent = score.toLocaleString();
  el("finalLevel").textContent = level;
  el("finalBest").textContent = best.toLocaleString();
  el("finalWord").innerHTML = reason.replace(/([A-Z]{3,})/, "<b>$1</b>");
  el("overScreen").hidden = false;
}

el("startBtn").addEventListener("click", startRun);
el("againBtn").addEventListener("click", startRun);
el("checkBtn").addEventListener("click", check);
el("shuffleBtn").addEventListener("click", shuffle);
el("hintBtn").addEventListener("click", useHint);
el("skipBtn").addEventListener("click", skip);
input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });

bestOut.textContent = best.toLocaleString();
</script>
</body>
</html>
